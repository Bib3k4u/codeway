# Production / test-server profile: SPRING_PROFILES_ACTIVE=prod
# Secrets and DB come from environment variables (see deploy/ec2/codeway.env.example).
codeway.expose-errors=false
codeway.runner.mode=${RUNNER_MODE:docker}
codeway.runner.max-concurrent=${RUNNER_MAX_CONCURRENT:2}
codeway.runner.memory=${RUNNER_MEMORY:512m}
codeway.cors.origins=${CORS_ORIGINS:http://localhost:*}
server.forward-headers-strategy=framework
logging.level.root=INFO
