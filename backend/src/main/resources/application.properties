spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/codeway}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.default-property-inclusion=non_null

# Supabase Auth (GitHub sign-in): tokens are verified against this project's public signing keys
codeway.supabase.url=${SUPABASE_URL:https://uranrdbdvboeqqimmfgb.supabase.co}
codeway.runner.mode=${RUNNER_MODE:local}
# Docker sandbox image (Java, Python, Node, g++); built from deploy/ec2/sandbox, keep the tag in sync with sandbox/tag
codeway.runner.image=${RUNNER_IMAGE:codeway-sandbox:1}
codeway.ai.endpoint=${AI_ENDPOINT:}
codeway.ai.api-key=${AI_API_KEY:}
codeway.ai.api-version=${AI_API_VERSION:}
codeway.ai.model=${AI_MODEL:}
codeway.ai.hint-model=${AI_HINT_MODEL:}
# Daily caps on AI calls (UTC day): per user and for the whole app. 0 = no cap.
codeway.ai.daily-user-limit=${AI_DAILY_USER_LIMIT:40}
codeway.ai.daily-global-limit=${AI_DAILY_GLOBAL_LIMIT:300}
